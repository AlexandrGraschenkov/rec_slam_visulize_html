<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализация маршрута с событиями</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #ddd;
            min-width: 300px;
            background: white;
        }
        
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        
        .resize-handle {
            width: 4px;
            background: #ddd;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        
        .resize-handle:hover {
            background: #007bff;
        }
        
        .header {
            background: #007bff;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .url-input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .url-input {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            min-width: 300px;
        }
        
        .load-btn {
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .load-btn:hover {
            background: #218838;
        }
        
        .load-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        
        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            padding-bottom: 315px;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }
        
        /* Ensure overlay is positioned relative to the video area, not the whole container */
        #videoContainer {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        
        .timeline-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            border-top: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            min-height: 200px;
            max-height: 300px;
            z-index: 10;
            overflow-y: auto;
        }
        
        .video-player {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .pothole-rect {
            position: absolute;
            border: 4px solid #dc3545;
            background: rgba(220, 53, 69, 0.2);
            pointer-events: none;
            z-index: 11;
        }
        
        .video-switcher {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        
        .video-switch-btn {
            padding: 6px 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        .video-switch-btn.active {
            background: #007bff;
        }
        
        .video-switch-btn:hover {
            opacity: 0.9;
        }
        
        .timeline {
            height: 60px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        
        .timeline-container {
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        
        .timeline-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .confidence-timeline {
            height: 40px;
            background: #e9ecef;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        
        .timeline-marker {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #007bff;
            z-index: 10;
            border-radius: 1px;
        }
        
        .timeline-event {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            transform: translateX(-50%);
            z-index: 5;
            opacity: 0.8;
            border-radius: 2px;
        }
        
        .event-pothole { background: #dc3545; }
        .event-erased_markings { background: #fd7e14; }
        .event-garbage_on_road { background: #28a745; }
        .event-damaged_sign { background: #6f42c1; }
        .event-manual { background: #007bff; }
        .event-default { background: #6c757d; }
        
        .map-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #map {
            flex: 1;
            width: 100%;
        }
        
        .controls {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .device-info-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }
        
        .play-pause-btn {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .play-pause-btn:hover {
            background: #0056b3;
        }
        
        .time-display {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 14px;
            color: #495057;
        }
        
        .device-info-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }
        
        .device-info-btn:hover {
            background: #0056b3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
        }
        
        .device-icon {
            font-size: 16px;
        }
        
        .arrow-icon {
            font-size: 12px;
            transition: transform 0.2s;
        }
        
        .arrow-icon.rotated {
            transform: rotate(180deg);
        }
        
        .device-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .device-overlay-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .device-overlay-content h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #495057;
        }
        
        .device-details {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.6;
        }
        
        .device-details p {
            margin: 0 0 8px 0;
        }
        
        .device-details p:last-child {
            margin-bottom: 0;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            margin: 15px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .arrow-marker {
            background: transparent !important;
            border: none !important;
        }
        
        .no-data {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 16px;
        }
        
        .confidence-controls {
            background: #f8f9fa;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            margin-bottom: 10px;
            display: none;
            flex-shrink: 0;
        }
        
        .confidence-controls.show {
            display: block;
        }
        
        .confidence-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .confidence-label {
            font-size: 14px;
            font-weight: 500;
            color: #495057;
        }
        
        .confidence-value {
            font-size: 14px;
            color: #007bff;
            font-weight: 600;
        }
        
        .confidence-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        .confidence-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        
        .confidence-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: none;
        }
        
        .confidence-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .confidence-btn:hover {
            background: #5a6268;
        }
        
        .confidence-btn.active {
            background: #007bff;
        }
        
        .pothole-event {
            background: #dc3545;
        }
        
        .pothole-event.low-confidence {
            background: #dc3545;
            opacity: 0.1;
            height: 50%;
            top: 25%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="header">
                <h1>Визуализация маршрута с событиями</h1>
                <div class="url-input-container">
                    <input type="text" class="url-input" id="yandexUrl" placeholder="Введите URL папки Яндекс.Диска" onkeypress="handleEnterKey(event)">
                    <button class="load-btn" id="loadBtn" onclick="loadData()">Загрузить</button>
                </div>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Загрузка данных...</div>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            
            
            <div class="video-section" id="videoSection" style="display: none;">
                <div class="video-container">
                    <div class="video-switcher" id="videoSwitcher"></div>
                    <div id="videoContainer"></div>
                </div>
                
                <div class="timeline-section">
                    <div class="timeline-container">
                        <div class="timeline-label">События</div>
                        <div class="timeline" id="timeline" onclick="seekToTime(event)">
                            <div class="timeline-marker" id="timelineMarker"></div>
                            <div id="timelineEvents"></div>
                        </div>
                    </div>
                    
                    <div class="timeline-container">
                        <div class="timeline-label">Автоматические ямы</div>
                        <div class="confidence-timeline" id="confidenceTimeline" onclick="seekToTime(event)">
                            <div class="timeline-marker" id="confidenceTimelineMarker"></div>
                            <div id="confidenceTimelineEvents"></div>
                        </div>
                    </div>
                    
                    <div class="confidence-controls" id="confidenceControls">
                        <div class="confidence-header">
                            <span class="confidence-label">Настройка уверенности для ям</span>
                            <span class="confidence-value" id="confidenceValue">40%</span>
                        </div>
                        <input type="range" class="confidence-slider" id="confidenceSlider" 
                               min="0" max="100" value="40" oninput="updateConfidence(this.value)">
                    </div>
                </div>
            </div>
            
            <div class="device-overlay" id="deviceOverlay" style="display: none;" onclick="closeDeviceOverlay(event)">
                <div class="device-overlay-content" onclick="event.stopPropagation()">
                    <h3>Информация об устройстве</h3>
                    <div class="device-details" id="deviceDetails"></div>
                </div>
            </div>
            
            <div class="controls" id="controls" style="display: none;">
                <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()">▶️ Воспроизведение</button>
                <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                <button class="device-info-btn" id="deviceInfoBtn" onclick="toggleDeviceInfo()" title="Информация об устройстве">
                    <span class="device-icon">📱</span>
                    <span class="arrow-icon" id="arrowIcon">▼</span>
                </button>
            </div>
        </div>
        
        <div class="resize-handle" id="resizeHandle"></div>
        
        <div class="right-panel">
            <div class="map-section">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Глобальные переменные
        let gpsData = [];
        let events = [];
        let potholeEvents = [];
        let deviceInfo = {};
        let frameTimes = [];
        let startTime = 0;
        let endTime = 0;
        let duration = 0;
        let map = null;
        let trajectory = null;
        let eventMarkers = [];
        let potholeMarkers = [];
        let currentMarker = null;
        let videos = [];
        let currentVideoIndex = 0;
        let currentVideo = null;
        let isPlaying = false;
        let currentTime = 0;
        let confidenceThreshold = 0.4; // 40% по умолчанию
        let videoOverlay = null;
        let activePotholeRects = [];
        
        // Элементы DOM
        const loadingEl = document.getElementById('loading');
        const errorMessageEl = document.getElementById('errorMessage');
        const videoSectionEl = document.getElementById('videoSection');
        const controlsEl = document.getElementById('controls');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const timeline = document.getElementById('timeline');
        const timelineMarker = document.getElementById('timelineMarker');
        const timelineEvents = document.getElementById('timelineEvents');
        const confidenceControls = document.getElementById('confidenceControls');
        const confidenceTimeline = document.getElementById('confidenceTimeline');
        const confidenceTimelineMarker = document.getElementById('confidenceTimelineMarker');
        const confidenceTimelineEvents = document.getElementById('confidenceTimelineEvents');
        
        // Инициализация карты
        function initMap() {
            if (map) {
                map.remove();
            }
            
            map = L.map('map').setView([55.7558, 37.6176], 10);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }
        
        // Загрузка данных с Яндекс.Диска
        async function loadData() {
            const url = document.getElementById('yandexUrl').value.trim();
            if (!url) {
                showError('Введите URL папки Яндекс.Диска');
                return;
            }
            
            showLoading(true);
            hideError();
            
            try {
                // Извлекаем ID папки из URL
                const folderId = extractFolderId(url);
                if (!folderId) {
                    throw new Error('Не удалось извлечь ID папки из URL');
                }
                
                // Получаем список файлов
                const filesData = await getAllFilesFromFolder(folderId, url);
                if (!filesData) {
                    throw new Error('Не удалось получить список файлов');
                }
                
                // Загружаем нужные файлы
                const requiredFiles = ['detections.json', 'gps.csv', 'device.txt', 'times_full.json'];
                const loadedData = {};
                
                for (const filename of requiredFiles) {
                    if (filesData[filename]) {
                        console.log(`Загружаем ${filename}...`);
                        const content = await downloadFileContent(filesData[filename]);
                        if (content !== null) {
                            loadedData[filename] = content;
                            console.log(`Загружен: ${filename}`);
                        }
                    } else {
                        console.log(`Файл ${filename} не найден`);
                    }
                }
                
                // Парсим данные
                if (loadedData['gps.csv']) {
                    gpsData = parseGpsData(loadedData['gps.csv']);
                }
                
                if (loadedData['detections.json']) {
                    const detectionData = parseDetectionsData(loadedData['detections.json']);
                    events = detectionData.events;
                    potholeEvents = detectionData.potholes;
                }
                
                if (loadedData['device.txt']) {
                    deviceInfo = parseDeviceInfo(loadedData['device.txt']);
                }
                
                if (loadedData['times_full.json']) {
                    const timesData = parseTimesData(loadedData['times_full.json']);
                    frameTimes = timesData.frame_times || [];
                    duration = timesData.duration || 0;
                }
                
                // Получаем ссылки на видео
                const videoUrls = await getVideoUrls(folderId, url);
                
                // Инициализируем интерфейс
                initInterface();
                
                if (gpsData.length > 0) {
                    initMapWithData();
                }
                
                if (Object.keys(videoUrls).length > 0) {
                    initVideoPlayers(videoUrls);
                }
                
                showLoading(false);
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showError(`Ошибка загрузки: ${error.message}`);
                showLoading(false);
            }
        }
        
        // Извлечение ID папки из URL
        function extractFolderId(url) {
            const match = url.match(/\/d\/([^\/]+)/);
            return match ? match[1] : null;
        }
        
        // Получение всех файлов из папки
        async function getAllFilesFromFolder(folderId, url) {
            try {
                const folderPath = extractFolderPath(url);
                console.log(`Путь к папке: ${folderPath}`);
                
                const apiUrl = generateApiUrl(folderId, folderPath);
                console.log(`API URL: ${apiUrl}`);
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const jsonResponse = await response.json();
                if (!jsonResponse._embedded || !jsonResponse._embedded.items) {
                    throw new Error('Не удалось получить список файлов');
                }
                
                const filesData = {};
                for (const item of jsonResponse._embedded.items) {
                    if (item.type === 'file') {
                        filesData[item.name] = item;
                    }
                }
                
                console.log(`Найдено файлов: ${Object.keys(filesData).length}`);
                return filesData;
                
            } catch (error) {
                console.error('Ошибка при получении списка файлов:', error);
                return null;
            }
        }
        
        // Извлечение пути к папке из URL
        function extractFolderPath(url) {
            const match = url.match(/\/d\/[^\/]+(.*)/);
            if (match) {
                let path = match[1];
                if (path.startsWith('/')) {
                    path = path.substring(1);
                }
                return path ? '/' + path : '';
            }
            return '';
        }
        
        // Генерация API URL
        function generateApiUrl(folderId, path = '') {
            const baseUrl = `https://yadi.sk/d/${folderId}`;
            const key = encodeURIComponent(baseUrl);
            const pathKey = encodeURIComponent(path);
            return `https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${key}&path=${pathKey}&limit=1000`;
        }
        
        // Загрузка содержимого файла
        async function downloadFileContent(fileInfo) {
            try {
                if (!fileInfo.file) {
                    console.log('Нет ссылки для скачивания файла');
                    return null;
                }
                
                const response = await fetch(fileInfo.file);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                return await response.text();
                
            } catch (error) {
                console.error('Ошибка при загрузке содержимого файла:', error);
                return null;
            }
        }
        
        // Получение ссылок на видео
        async function getVideoUrls(folderId, url) {
            try {
                const filesData = await getAllFilesFromFolder(folderId, url);
                if (!filesData) {
                    return {};
                }
                
                const videoFiles = ['video', 'video_2'];
                const videoUrls = {};
                
                for (const videoFilename of videoFiles) {
                    if (filesData[videoFilename]) {
                        const videoUrl = filesData[videoFilename].file;
                        if (videoUrl) {
                            videoUrls[videoFilename] = videoUrl;
                            console.log(`Найдена ссылка на видео: ${videoFilename}`);
                        }
                    }
                }
                
                return videoUrls;
                
            } catch (error) {
                console.error('Ошибка при получении ссылок на видео:', error);
                return {};
            }
        }
        
        // Парсинг GPS данных
        function parseGpsData(csvData) {
            const lines = csvData.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                
                headers.forEach((header, index) => {
                    const value = values[index];
                    if (header === 'time' || header === 'lat' || header === 'lon' || 
                        header === 'accuracy' || header === 'altitude' || header === 'speed' || header === 'course') {
                        row[header] = parseFloat(value) || null;
                    } else {
                        row[header] = value;
                    }
                });
                
                data.push(row);
            }
            
            // Нормализуем время относительно первого timestamp
            if (data.length > 0) {
                const startTime = data[0].time;
                for (const point of data) {
                    point.time = point.time - startTime;
                }
            }
            
            return data;
        }
        
        // Парсинг данных о событиях
        function parseDetectionsData(jsonData) {
            const data = JSON.parse(jsonData);
            const events = [];
            const potholes = [];
            
            // Обрабатываем ручные события
            if (data.manualEvents) {
                for (const event of data.manualEvents) {
                    events.push({
                        type: 'manual',
                        event_type: event.event.type,
                        time: event.time,
                        lat: event.coordinate.latitude,
                        lon: event.coordinate.longitude,
                        custom_name: event.event.customName || ''
                    });
                }
            }
            
            // Обрабатываем ямы
            if (data.potholes) {
                for (const pothole of data.potholes) {
                    const potholeEvent = {
                        type: 'pothole',
                        event_type: 'pothole',
                        time: pothole.timestamp,
                        lat: pothole.coord.latitude,
                        lon: pothole.coord.longitude,
                        confidence: pothole.conf,
                        rect: pothole.rect // Добавляем информацию о прямоугольнике
                    };
                    
                    // Добавляем в общий список событий
                    events.push(potholeEvent);
                    
                    // Добавляем в отдельный список ям
                    potholes.push(potholeEvent);
                }
            }
            
            return { events, potholes };
        }
        
        // Парсинг информации об устройстве
        function parseDeviceInfo(jsonData) {
            return JSON.parse(jsonData);
        }
        
        // Парсинг данных о временных метках
        function parseTimesData(jsonData) {
            const data = JSON.parse(jsonData);
            
            if (!data || data.length === 0) {
                return { start_time: 0, end_time: 0, duration: 0, frame_times: [] };
            }
            
            const startTime = data[0].time;
            const endTime = data[data.length - 1].time;
            const duration = endTime - startTime;
            
            const frameTimes = data.map(frame => ({
                time: frame.time - startTime,
                system_time: frame.system_time || 0
            }));
            
            return {
                start_time: startTime,
                end_time: endTime,
                duration: duration,
                frame_times: frameTimes
            };
        }

        // Создание событий на таймлайне
        function createTimelineEvents() {
            timelineEvents.innerHTML = '';
            confidenceTimelineEvents.innerHTML = '';
            
            // События (исключая ямы)
            const nonPotholeEvents = events.filter(event => event.event_type !== 'pothole');
            for (const event of nonPotholeEvents) {
                const leftPercent = ((event.time - startTime) / (endTime - startTime)) * 100;
                const eventDiv = document.createElement('div');
                eventDiv.className = `timeline-event event-${event.event_type}`;
                eventDiv.style.left = `${leftPercent}%`;
                eventDiv.title = event.event_type;
                timelineEvents.appendChild(eventDiv);
            }
            
            // Ямы на отдельном таймлайне
            for (const pothole of potholeEvents) {
                const leftPercent = ((pothole.time - startTime) / (endTime - startTime)) * 100;
                const eventDiv = document.createElement('div');
                eventDiv.className = `timeline-event pothole-event`;
                
                // Применяем фильтр уверенности
                if (pothole.confidence < confidenceThreshold) {
                    eventDiv.classList.add('low-confidence');
                }
                
                eventDiv.style.left = `${leftPercent}%`;
                eventDiv.title = `Яма (уверенность: ${(pothole.confidence * 100).toFixed(1)}%)`;
                confidenceTimelineEvents.appendChild(eventDiv);
            }
        }
        
        // Инициализация карты с данными
        function initMapWithData() {
            if (gpsData.length === 0) return;
            
            // Устанавливаем центр карты на первую точку GPS
            map.setView([gpsData[0].lat, gpsData[0].lon], 15);
            
            // Создаем траекторию
            const coordinates = gpsData.map(point => [point.lat, point.lon]);
            trajectory = L.polyline(coordinates, {
                color: '#007bff',
                weight: 3,
                opacity: 0.8
            }).addTo(map);
            
            // Добавляем маркеры событий
            addEventMarkers();
            
            // Подгоняем карту под траекторию
            map.fitBounds(trajectory.getBounds());
        }
        
        // Добавление маркеров событий
        function addEventMarkers() {
            // Очищаем предыдущие маркеры
            eventMarkers.forEach(({ marker }) => map.removeLayer(marker));
            potholeMarkers.forEach(({ marker }) => map.removeLayer(marker));
            eventMarkers = [];
            potholeMarkers = [];
            
            // Добавляем маркеры для событий (исключая ямы)
            const nonPotholeEvents = events.filter(event => event.event_type !== 'pothole');
            for (const event of nonPotholeEvents) {
                const eventColor = getEventColor(event.event_type);
                const marker = L.circleMarker([event.lat, event.lon], {
                    radius: 8,
                    color: eventColor,
                    fillColor: eventColor,
                    fillOpacity: 0.7,
                    weight: 2
                }).addTo(map);
                
                const popupContent = `
                    <strong>${event.event_type}</strong><br>
                    Время: ${formatTime(event.time)}<br>
                    GPS: ${event.lat.toFixed(6)}, ${event.lon.toFixed(6)}<br>
                `;
                
                marker.bindPopup(popupContent);
                
                // Добавляем обработчик клика для перемотки видео
                marker.on('click', () => {
                    seekToEventTime(event.time);
                });
                
                eventMarkers.push({ marker, time: event.time });
            }
            
            // Добавляем маркеры для ям с учетом фильтра уверенности
            for (const pothole of potholeEvents) {
                const isHighConfidence = pothole.confidence >= confidenceThreshold;
                const marker = L.circleMarker([pothole.lat, pothole.lon], {
                    radius: isHighConfidence ? 8 : 5, // В 3 раза меньше для низкой уверенности
                    color: '#dc3545',
                    fillColor: '#dc3545',
                    fillOpacity: isHighConfidence ? 0.7 : 0.2,
                    weight: isHighConfidence ? 2 : 0.5, // Тонкая обводка для низкой уверенности
                    opacity: isHighConfidence ? 1 : 0.5 // Прозрачность обводки
                }).addTo(map);
                
                const popupContent = `
                    <strong>Яма</strong><br>
                    Время: ${formatTime(pothole.time)}<br>
                    GPS: ${pothole.lat.toFixed(6)}, ${pothole.lon.toFixed(6)}<br>
                    Уверенность: ${(pothole.confidence * 100).toFixed(1)}%
                `;
                
                marker.bindPopup(popupContent);
                
                // Добавляем обработчик клика для перемотки видео
                marker.on('click', () => {
                    seekToEventTime(pothole.time);
                });
                
                potholeMarkers.push({ marker, time: pothole.time, confidence: pothole.confidence });
            }
        }
        
        // Получение цвета события
        function getEventColor(eventType) {
            const colors = {
                'pothole': '#dc3545',
                'erased_markings': '#fd7e14',
                'garbage_on_road': '#28a745',
                'damaged_sign': '#6f42c1',
                'manual': '#007bff',
                'default': '#6c757d'
            };
            return colors[eventType] || colors['default'];
        }

        // Интерполяция GPS координат
        function interpolateGPS(time) {
            if (gpsData.length === 0) return [0, 0, 0];
            
            // Если время до первой точки
            if (time <= gpsData[0].time) {
                return [gpsData[0].lat, gpsData[0].lon, gpsData[0].course];
            }
            
            // Если время после последней точки
            if (time >= gpsData[gpsData.length - 1].time) {
                const last = gpsData[gpsData.length - 1];
                return [last.lat, last.lon, last.course];
            }
            
            // Находим две ближайшие GPS точки
            for (let i = 0; i < gpsData.length - 1; i++) {
                if (gpsData[i].time <= time && gpsData[i + 1].time >= time) {
                    const point1 = gpsData[i];
                    const point2 = gpsData[i + 1];
                    
                    const ratio = (time - point1.time) / (point2.time - point1.time);
                    const lat = point1.lat + (point2.lat - point1.lat) * ratio;
                    const lon = point1.lon + (point2.lon - point1.lon) * ratio;
                    
                    // Интерполяция курса
                    let course = null;
                    if (point1.course !== null && point2.course !== null) {
                        let courseDiff = point2.course - point1.course;
                        if (courseDiff > 180) courseDiff -= 360;
                        if (courseDiff < -180) courseDiff += 360;
                        course = point1.course + courseDiff * ratio;
                        if (course < 0) course += 360;
                        if (course >= 360) course -= 360;
                    } else if (point1.course !== null) {
                        course = point1.course;
                    } else if (point2.course !== null) {
                        course = point2.course;
                    }
                    
                    return [lat, lon, course];
                }
            }
            
            return [gpsData[0].lat, gpsData[0].lon, gpsData[0].course];
        }
        
        // Расчет направления между двумя точками
        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360;
        }
        
        // Обновление маркера на карте
        function updateMapMarker(time) {
            if (gpsData.length === 0) return;
            
            const [lat, lon, course] = interpolateGPS(time);
            
            // Удаляем предыдущий маркер
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            
            // Определяем направление движения
            let direction = course;
            if (direction === null || direction === undefined) {
                // Находим ближайшие GPS точки для расчета направления
                for (let i = 0; i < gpsData.length - 1; i++) {
                    if (gpsData[i].time <= time && gpsData[i + 1].time >= time) {
                        direction = calculateBearing(gpsData[i].lat, gpsData[i].lon, gpsData[i + 1].lat, gpsData[i + 1].lon);
                        break;
                    }
                }
                
                if (direction === null || direction === undefined) {
                    if (time <= gpsData[0].time && gpsData.length > 1) {
                        direction = calculateBearing(gpsData[0].lat, gpsData[0].lon, gpsData[1].lat, gpsData[1].lon);
                    } else if (time >= gpsData[gpsData.length - 1].time && gpsData.length > 1) {
                        const lastIndex = gpsData.length - 1;
                        direction = calculateBearing(gpsData[lastIndex - 1].lat, gpsData[lastIndex - 1].lon, gpsData[lastIndex].lat, gpsData[lastIndex].lon);
                    } else {
                        direction = 0;
                    }
                }
            }
            direction -= 90;
            
            // Создаем иконку стрелочки
            const arrowIcon = L.divIcon({
                html: `<div style="transform: rotate(${direction}deg); font-size: 30px; color: #007bff; text-align: center; line-height: 1;">➤</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                className: 'arrow-marker'
            });
            
            // Создаем маркер со стрелочкой
            currentMarker = L.marker([lat, lon], { icon: arrowIcon }).addTo(map);
        }
        
        // Обновление таймлайна
        function updateTimeline(time) {
            const progress = (time - startTime) / (endTime - startTime);
            timelineMarker.style.left = (progress * 100) + '%';
            confidenceTimelineMarker.style.left = (progress * 100) + '%';
        }
        
        // Форматирование времени
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
        }
        
        // Обновление отображения времени
        function updateTimeDisplay() {
            const current = formatTime(currentTime);
            const total = formatTime(endTime - startTime);
            timeDisplay.textContent = `${current} / ${total}`;
        }
        
        // Обновление прямоугольников ям
        function updatePotholeRects(time) {
            if (!videoOverlay || !currentVideo) return;
            
            // Не рисуем прямоугольники ям на втором видео (индекс 1)
            if (currentVideoIndex === 1) return;
            
            // Очищаем предыдущие прямоугольники
            clearPotholeRects();
            
            // Находим ямы в окне ±0.5 секунды
            const timeWindow = 0.5;
            const startTimeWindow = time - timeWindow;
            const endTimeWindow = time + timeWindow;
            
            for (const pothole of potholeEvents) {
                // Проверяем, что яма в временном окне и имеет высокую уверенность
                if (pothole.time >= startTimeWindow && pothole.time <= endTimeWindow && 
                    pothole.confidence >= confidenceThreshold && pothole.rect) {
                    createPotholeRect(pothole);
                }
            }
        }
        
        // Создание прямоугольника ямы
        function createPotholeRect(pothole) {
            if (!videoOverlay || !pothole.rect) return;
            
            const rect = document.createElement('div');
            rect.className = 'pothole-rect';
            
            // Получаем размеры видео
            const videoRect = currentVideo.getBoundingClientRect();
            const videoWidth = currentVideo.videoWidth;
            const videoHeight = currentVideo.videoHeight;
            
            if (videoWidth === 0 || videoHeight === 0) return;
            
            // Координаты прямоугольника из данных [[x, y], [width, height]]
            const [[x, y], [width, height]] = pothole.rect;
            
            // Масштабируем координаты под размер отображаемого видео
            const scaleX = videoRect.width / videoWidth;
            const scaleY = videoRect.height / videoHeight;
            
            // Устанавливаем позицию и размеры
            rect.style.left = (x * scaleX) + 'px';
            rect.style.top = (y * scaleY) + 'px';
            rect.style.width = (width * scaleX) + 'px';
            rect.style.height = (height * scaleY) + 'px';
            
            videoOverlay.appendChild(rect);
            activePotholeRects.push(rect);
        }
        
        // Очистка прямоугольников ям
        function clearPotholeRects() {
            if (!videoOverlay) return;
            
            activePotholeRects.forEach(rect => {
                if (rect.parentNode) {
                    rect.parentNode.removeChild(rect);
                }
            });
            activePotholeRects = [];
        }
        
        // Переключение воспроизведения
        function togglePlayPause() {
            if (currentVideo) {
                if (isPlaying) {
                    currentVideo.pause();
                } else {
                    currentVideo.play();
                }
            }
        }
        
        // Переход к времени по клику на таймлайн
        function seekToTime(event) {
            let rect;
            if (event.target === confidenceTimeline || confidenceTimeline.contains(event.target)) {
                rect = confidenceTimeline.getBoundingClientRect();
            } else {
                rect = timeline.getBoundingClientRect();
            }
            
            const x = event.clientX - rect.left;
            const progress = x / rect.width;
            const time = startTime + progress * (endTime - startTime);
            
            currentTime = time;
            if (currentVideo) {
                currentVideo.currentTime = time;
            }
            updateMapMarker(time);
            updateTimeline(time);
            updateTimeDisplay();
            updatePotholeRects(time);
        }

        // Обработчик изменения размера панелей
        let isResizing = false;
        const resizeHandle = document.getElementById('resizeHandle');
        const leftPanel = document.querySelector('.left-panel');
        const rightPanel = document.querySelector('.right-panel');
        
        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', handleResize);
            document.addEventListener('mouseup', stopResize);
        });
        
        function handleResize(e) {
            if (!isResizing) return;
            
            const containerWidth = document.querySelector('.container').offsetWidth;
            const leftWidth = (e.clientX / containerWidth) * 100;
            const rightWidth = 100 - leftWidth;
            
            if (leftWidth > 20 && rightWidth > 20) {
                leftPanel.style.flex = leftWidth;
                rightPanel.style.flex = rightWidth;
            }
        }
        
        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', handleResize);
            document.removeEventListener('mouseup', stopResize);
        }
        
        // Обновление порога уверенности
        function updateConfidence(value) {
            confidenceThreshold = value / 100;
            document.getElementById('confidenceValue').textContent = value + '%';
            
            // Обновляем таймлайн ям
            createTimelineEvents();
            
            // Обновляем маркеры на карте
            addEventMarkers();
            
            // Обновляем прямоугольники ям
            updatePotholeRects(currentTime);
        }
        
        // Переход к времени события
        function seekToEventTime(time) {
            currentTime = time;
            if (currentVideo) {
                currentVideo.currentTime = time;
            }
            updateMapMarker(time);
            updateTimeline(time);
            updateTimeDisplay();
            updatePotholeRects(time);
        }
        
        // Обработчик нажатия Enter в поле ввода URL
        function handleEnterKey(event) {
            if (event.key === 'Enter') {
                loadData();
            }
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
        });
    </script>
</body>
