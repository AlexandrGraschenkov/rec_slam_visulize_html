<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Seek</title>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="https://disk.yandex.ru/d/OXJEgaEPF9f6YA/Default/2025-10-21_18-10-43_CBEC188A-36A/video" allowfullscreen></iframe>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const videos = document.querySelectorAll('video');
                if (videos.length > 0) {
                    const video = videos[0];
                    video.pause();
                    video.currentTime = 15;
                }
            }, 2000);
        });
    </script>
</body>
</html>
